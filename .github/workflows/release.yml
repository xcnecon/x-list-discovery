name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - name: Check release tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c "import os, x_list_discovery; assert os.environ['TAG'] == 'v' + x_list_discovery.__version__, 'Select the version tag when running this workflow'"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_distribution.py dist > dist/manifest.json
      - name: Create a draft with installable distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --draft --title "X List Discovery $TAG" --notes-file CHANGELOG.md
