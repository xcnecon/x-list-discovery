[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "x-list-discovery"
version = "0.1.0"
description = "Find accounts outside your X list through shared follows, with a separate underfollowed ranking"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chenning Xu"}]
keywords = ["twitter", "x", "lists", "social-graph", "account-discovery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = ["requests>=2.26,<3", "python-dotenv>=1,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/xcnecon/x-list-discovery"
Repository = "https://github.com/xcnecon/x-list-discovery"
Issues = "https://github.com/xcnecon/x-list-discovery/issues"
Changelog = "https://github.com/xcnecon/x-list-discovery/blob/main/CHANGELOG.md"

[project.scripts]
x-list-discovery = "x_list_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
